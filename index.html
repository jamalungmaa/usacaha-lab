<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клинический тренажёр</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef2f5;
    margin: 0;
    padding: 20px;
  }

  .wrap    { max-width: 680px; margin: 0 auto; }
  h1       { font-size: 24px; color: #123a5c; margin: 0 0 4px; }
  .sub     { color: #5a7184; font-size: 14px; margin-bottom: 16px; }

  /* Счётчик сверху */
  .score {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between;
    background: #123a5c; color: #fff;
    border-radius: 10px; padding: 10px 16px;
    font-size: 14px; margin-bottom: 14px;
  }

  .card {
    background: #fff; border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(20,40,60,.08);
  }

  h3 {
    color: #123a5c; font-size: 14px;
    text-transform: uppercase; letter-spacing: .4px;
    margin: 16px 0 6px;
  }

  .tag   { display: inline-block; background: #e3f0fa; color: #1a6bad;
           border-radius: 20px; padding: 3px 12px; font-size: 13px; margin: 3px 4px 3px 0; }
  .vital { display: inline-block; background: #f2f7fb; border: 1px solid #d7e4ee;
           border-radius: 10px; padding: 6px 12px; font-size: 14px; margin: 3px 4px 3px 0; }

  .opt {
    display: block; border: 2px solid #d7e4ee; border-radius: 10px;
    padding: 10px 14px; margin: 8px 0; cursor: pointer;
    font-size: 15px; background: #fff; transition: .15s;
    user-select: none;
  }
  .opt:hover      { border-color: #2e86c1; }
  .opt.sel        { border-color: #2e86c1; background: #eaf4fc; }
  .opt.ok         { border-color: #27ae60; background: #eafaf1; }
  .opt.bad        { border-color: #e74c3c; background: #fdecea; }

  .btn {
    display: block; width: 100%; padding: 14px;
    border: 0; border-radius: 10px; background: #2e86c1;
    color: #fff; font-size: 17px; cursor: pointer; margin-top: 12px;
  }
  .btn:disabled   { background: #b9c9d6; cursor: default; }
  .btn.ghost      { background: #fff; color: #2e86c1; border: 2px solid #2e86c1; }

  .fb      { border-radius: 10px; padding: 14px; margin-top: 12px; font-size: 14px; line-height: 1.5; }
  .fb.good { background: #eafaf1; border: 1px solid #a9dfbf; }
  .fb.warn { background: #fdf2e9; border: 1px solid #f5cba7; }
  .why     { color: #5a6a78; font-size: 13px; margin-top: 4px; }
  .dev     { background: #f4f0fa; border: 1px solid #d9cfee; border-radius: 10px;
             padding: 10px 14px; margin-top: 10px; font-size: 13px; color: #4a3b73; }
  .disc    { color: #98a8b5; font-size: 12px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>

<div class="wrap">
  <h1>&#129656; Клинический тренажёр</h1>
  <div class="sub">Поставьте диагноз и подберите лечение. Реальные патологии, реальная логика.</div>

  <div class="score">
    <span id="progress">Случай 1 из 10</span>
    <span id="scoreView">Счёт: 0</span>
  </div>

  <div id="game"></div>

  <div class="disc">Учебный тренажёр. Не является медицинской рекомендацией:
       если заболели по-настоящему — к врачу.</div>
</div>

<script>
"use strict";

   complaint    — жалобы и анамнез

   options      — варианты диагноза (первый не обязан быть верным)
   correct      — ИНДЕКС верного диагноза в options (с нуля)
   treatments   — варианты лечения:
                    t   — текст метода
                    ok  — true (верный) / false (ошибка)

   devices      — блок «инженеру на заметку»
   ================================================================ */

  {

/* ================================================================
   СОСТОЯНИЕ ИГРЫ
   ================================================================ */

let cur      = 0;    // номер текущего случая
let score    = 0;    // набранные баллы
let selDx    = -1;   // выбранный диагноз (индекс)
let selT     = [];   // выбранные методы лечения (индексы)
let answered = false;// ответ уже отправлен?
let shuffled = [];   // перемешанный порядок вариантов лечения

const MAX_PER_CASE = 5;  // 2 балла за диагноз + 3 за лечение

const $game     = document.getElementById('game');
const $progress = document.getElementById('progress');
const $score    = document.getElementById('scoreView');

/* ================================================================
   ЛОГИКА
   ================================================================ */

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Отрисовка текущего случая
function renderCase() {
  const c = CASES[cur];
  selDx = -1;
  selT = [];
  answered = false;
  shuffled = [...c.treatments.keys()].sort(() => Math.random() - 0.5);

  $progress.textContent = `Случай ${cur + 1} из ${CASES.length}`;
  $score.textContent = `Счёт: ${score}`;

  $game.innerHTML = `
    <div class="card">
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.complaint)}</p>

      <h3>Симптомы</h3>
      <div>${c.symptoms.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>

      <h3>Объективные данные</h3>
      <div>${c.vitals.map(v => `<span class="vital">${esc(v)}</span>`).join('')}</div>

      <h3>1. Ваш диагноз</h3>
      ${c.options.map((o, i) =>
        `<label class="opt" id="dx${i}" onclick="pickDx(${i})">${esc(o)}</label>`
      ).join('')}

      <h3>2. Лечение (выберите подходящие)</h3>
      ${shuffled.map(i => {
        const t = c.treatments[i];
        return `<label class="opt" id="tr${i}" onclick="pickTr(${i})">${esc(t.t)}</label>`;
      }).join('')}

      <button class="btn" id="submitBtn" onclick="submitAnswer()" disabled>
        Подтвердить решение
      </button>
      <div id="feedback"></div>
    </div>`;
}

// Выбор диагноза
function pickDx(i) {
  if (answered) return;
  selDx = i;
  CASES[cur].options.forEach((_, j) => {
    document.getElementById('dx' + j).classList.toggle('sel', j === i);
  });
  checkReady();
}

// Выбор / отмена метода лечения
function pickTr(i) {
  if (answered) return;
  const el = document.getElementById('tr' + i);
  if (selT.includes(i)) {
    selT = selT.filter(x => x !== i);
    el.classList.remove('sel');
  } else {
    selT.push(i);
    el.classList.add('sel');
  }
  checkReady();
}

// Кнопка активна, только если выбран диагноз и хотя бы один метод
function checkReady() {
  document.getElementById('submitBtn').disabled = (selDx < 0 || selT.length === 0);
}

// Проверка ответа и разбор
function submitAnswer() {
  if (answered) return;
  answered = true;

  const c = CASES[cur];
  const dxOk = (selDx === c.correct);

  let pts = dxOk ? 2 : 0;
  let tOk = 0, tBad = 0;
  const notes = [];

  c.treatments.forEach((t, i) => {
    const el = document.getElementById('tr' + i);
    const chosen = selT.includes(i);
    el.classList.add(t.ok ? 'ok' : 'bad');

    if (chosen && t.ok)  { tOk++; pts += 1; }
    if (chosen && !t.ok) { tBad++; pts -= 1; }
    if (t.ok && !chosen) {
      notes.push(`<div class="why">&#10007; Пропущено: <b>${esc(t.t)}</b> — ${esc(t.why)}</div>`);
    }
    if (chosen && !t.ok) {
      notes.push(`<div class="why">&#10007; Ошибка: <b>${esc(t.t)}</b> — ${esc(t.why)}</div>`);
    }
  });

  pts = Math.max(pts, 0);
  score += pts;
  $score.textContent = `Счёт: ${score}`;

  let h = `<div class="fb ${dxOk ? 'good' : 'warn'}">`;
  h += `<b style="font-size:16px">${dxOk ? '&#10003; Верно: ' : '&#10007; Диагноз: '}</b> ${esc(c.options[c.correct])}<br>`;
  h += `<b>${pts} балл(ов). Верно выбрано методов: ${tOk}, ошибок: ${tBad}.</b>`;
  h += `<p>${esc(c.explanation)}</p>`;
  h += notes.join('');
  h += `<div class="dev">&#128295; Инженеру на заметку: ${esc(c.devices)}</div>`;

  h += (cur < CASES.length - 1)
    ? `<button class="btn ghost" onclick="nextCase()">Следующий случай &#8594;</button>`
    : `<button class="btn ghost" onclick="finish()">Итоги &#8594;</button>`;
  h += `</div>`;

  document.getElementById('feedback').innerHTML = h;
}

function nextCase() {
  cur++;
  renderCase();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Финальный экран
function finish() {
  const max = CASES.length * MAX_PER_CASE;
  const p = score / max;
  let verdict;
  if      (p >= 0.85) verdict = 'Отлично — клиническое мышление на уровне. Можно усложнять задачи.';
  else if (p >= 0.60) verdict = 'Хорошая база. Обратите внимание на разобранные ошибки — там самая ценность.';
  else                verdict = 'Это нормально для старта. Перечитайте объяснения: каждый неверный выбор — это патогенез в одну строку.';

  $game.innerHTML = `
    <div class="card">
      <h3>Итоги смены</h3>
      <p>Набрано <b>${score}</b> из ${max} баллов.</p>
      <p>${verdict}</p>
      <button class="btn" onclick="restart()">Пройти заново</button>
    </div>`;
}

function restart() {
  cur = 0;
  score = 0;
  renderCase();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderCase();
</script>
